{% extends 'base.html' %}
{% block title %}STEP RAILWAY - ავტორიზაცია{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 60px auto; background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);">
    <h2 style="margin-bottom: 20px; color: #172b4d;">სისტემაში შესვლა</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-search" style="width: 100%; margin-top: 15px;">შესვლა</button>
    </form>
    <p style="margin-top: 15px; text-align: center; font-size: 14px;">არ გაქვთ ანგარიში? <a href="{% url 'register' %}" style="color: #0052cc;">რეგისტრაცია</a></p>
</div>
{% endblock %}
