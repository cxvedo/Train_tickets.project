{% extends 'base.html' %}


{% block title %}STEP RAILWAY - გადახდა{% endblock %}

{% block content %}
<div class="payment-container">
    <div class="payment-card">
        
        <div class="payment-title">სულ გადასახდელი: {{ total_price }}₾</div>
        <div class="payment-warning">* ყველა ველი აუცილებლად უნდა შეივსოს!!!</div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">ბარათის ნომერი*</label>
                <input type="text" name="card_number" placeholder="2456 1665 5155 5151" class="form-control" required>
            </div>

            <div class="form-row-grid">
                <div class="form-group">
                    <label class="form-label">მოქმედების ვადა*</label>
                    <input type="text" name="expiry_date" placeholder="MM/YY" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">CVC / CVV*</label>
                    <input type="password" name="cvv" placeholder="123" maxlength="4" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">ბარათის მფლობელი*</label>
                <input type="text" name="card_holder" placeholder="J. Smith" class="form-control" required>
            </div>

            <button type="submit" class="btn-pay">გადახდა</button>
        </form>

    </div>
</div>
{% endblock %}
